[package]
name = "pactum-config"
version = "0.1.0"
description = "Global configuration, fee vault, and CPI allowlist registry for Pactum."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pactum_config"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2" }
anchor-spl = "1.0.2"

[dev-dependencies]
litesvm = "0.12.0"
solana-account = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

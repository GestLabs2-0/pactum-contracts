[package]
name = "pactum-escrow"
version = "0.1.0"
description = "Escrow program for Pactum, managing Milestone/OneTime agreements, DateRange reservations, isolated USDC vaults, and dispute CPI hooks."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pactum_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "pactum-core/idl-build", "pactum-config/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
pactum-core = { path = "../pactum-core", features = ["cpi"] }
pactum-config = { path = "../pactum-config", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.12.0"
solana-account = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
